<!DOCTYPE html>
<html>
<head>
<title>Infinitx Sky</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

/* ===== BODY (SUPER COLORFUL ANIMATION) ===== */
body{
  margin:0;
  font-family:sans-serif;
  overflow:hidden;
  background:linear-gradient(270deg,#ff00cc,#00f2fe,#ffeb3b,#00ff9d);
  background-size:800% 800%;
  animation:bg 8s infinite;
}

@keyframes bg{
  0%{background-position:0%}
  50%{background-position:100%}
  100%{background-position:0%}
}

/* ===== LOADER ===== */
#loader{
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
}

.controller{
  font-size:80px;
  animation:spin 2s linear infinite, pulse 1.5s infinite, glow 1s infinite alternate;
}

@keyframes spin{
  100%{transform:rotate(360deg);}
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.3);}
  100%{transform:scale(1);}
}

@keyframes glow{
  from{text-shadow:0 0 10px white;}
  to{text-shadow:0 0 40px cyan;}
}

#loader h2{
  color:white;
  text-shadow:0 0 20px white;
}

/* ===== MAIN ===== */
#main{
  display:none;
  color:white;
  text-align:center;
  min-height:100vh;
}

/* ===== HEADER ===== */
.header{
  padding:15px;
  font-size:26px;
  font-weight:bold;
  text-shadow:0 0 20px white;
  animation:glowText 2s infinite alternate;
}

@keyframes glowText{
  from{text-shadow:0 0 10px white;}
  to{text-shadow:0 0 30px cyan;}
}

/* ===== HERO ===== */
.hero h1{
  text-shadow:0 0 25px white;
}

.hero p{
  opacity:0.9;
}

/* ===== FLOATING ICONS ===== */
.float{
  position:absolute;
  font-size:30px;
  animation:float 4s infinite;
}

.f1{top:100px; left:10px;}
.f2{top:200px; right:20px;}
.f3{top:300px; left:40px;}
.f4{top:400px; right:40px;}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(25px);}
  100%{transform:translateY(0);}
}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  padding:15px;
}

/* ===== CARD ===== */
.card{
  background:rgba(255,255,255,0.15);
  border-radius:20px;
  padding:20px;
  backdrop-filter:blur(10px);
  box-shadow:0 0 20px rgba(255,255,255,0.4);
  transition:0.3s;
  animation:cardGlow 3s infinite alternate;
}

@keyframes cardGlow{
  from{box-shadow:0 0 10px cyan;}
  to{box-shadow:0 0 30px pink;}
}

.card:hover{
  transform:scale(1.1);
}

/* ===== ICON ===== */
.icon{
  font-size:60px;
  margin:10px;
  animation:iconPulse 2s infinite;
}

@keyframes iconPulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.2);}
  100%{transform:scale(1);}
}

/* ===== TEXT ===== */
.card p{
  font-weight:bold;
}

/* ===== BUTTON ===== */
button{
  padding:10px 18px;
  border:none;
  border-radius:12px;
  background:#ff4b5c;
  color:white;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 15px #ff4b5c;
  animation:btnPulse 2s infinite;
}

@keyframes btnPulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.1);}
  100%{transform:scale(1);}
}

/* ===== YOUTUBE ===== */
.youtube{
  padding:20px;
}

.yt-btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:12px 18px;
  border-radius:40px;
  background:rgba(255,0,0,0.3);
  backdrop-filter:blur(10px);
  text-decoration:none;
  color:white;
  font-weight:bold;
  box-shadow:0 0 20px red;
  transition:0.3s;
}

.yt-btn:hover{
  transform:scale(1.1);
}

.yt-btn img{
  width:28px;
}

</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
  <div class="controller">🎮</div>
  <h2>Loading Infinitx Sky...</h2>
</div>

<!-- MAIN -->
<div id="main">

<div class="header">Infinitx Sky 🚀</div>

<div class="hero">
  <h1>🎮 Ultimate Gaming Hub</h1>
  <p>Play • Enjoy • Dominate</p>
</div>

<!-- FLOATING -->
<div class="float f1">🎮</div>
<div class="float f2">✨</div>
<div class="float f3">🕹️</div>
<div class="float f4">🔥</div>

<!-- GAMES -->
<div class="grid">

  <div class="card">
    <div class="icon">🧱</div>
    <p>Blocks Adventure</p>
    <button onclick="play('https://zv1y2i8p.play.gamezop.com/g/mKZZW9NXW')">PLAY</button>
  </div>

  <div class="card">
    <div class="icon">🍉</div>
    <p>Fruity Fiesta</p>
    <button onclick="play('https://zv1y2i8p.play.gamezop.com/g/yVywAGBQ6')">PLAY</button>
  </div>

  <div class="card">
    <div class="icon">⚪</div>
    <p>Bubble Shooter</p>
    <button onclick="play('https://zv1y2i8p.play.gamezop.com/g/9lpHai56Q')">PLAY</button>
  </div>

  <div class="card">
    <div class="icon">🗡️</div>
    <p>Assassin Hunt</p>
    <button onclick="play('https://zv1y2i8p.play.gamezop.com/g/UCS62KJ8c')">PLAY</button>
  </div>

</div>

<!-- YOUTUBE -->
<div class="youtube">
  <a href="https://www.youtube.com/@InfinitixSky" target="_blank" class="yt-btn">
    <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
    <span>Follow on YouTube</span>
  </a>
</div>

</div>

<script>

setTimeout(()=>{
  document.getElementById("loader").style.display="none";
  document.getElementById("main").style.display="block";
  document.body.style.overflow="auto";
},3000);

function play(url){
  document.body.innerHTML =
  `<iframe src="${url}" style="width:100%;height:100vh;border:0;"></iframe>`;
}

</script>

</body>
</html>
